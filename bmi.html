<!DOCTYPE html>
<html lang="en">

<body>
    BMI CALC
    <script>
    let w=prompt("Enter your weight");
    let h=prompt("Enter your height")
    let bmi=w/(h*h);
    if(bmi<18.5)
       alert("Underweight😓");
    else if(bmi>18.5 && bmi<24.9)
      alert("Healthy🥰")
    else if(bmi>24.9)
       alert("Overweight")
</script>
</body>
</html>
